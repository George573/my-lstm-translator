[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-translator"
version = "0.1.0"
description = "An educational English-to-French LSTM translation project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
dependencies = [
    "pandas>=2.0,<4.0",
    "sacrebleu>=2.4,<3.0",
    "torch>=2.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0,<5.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
